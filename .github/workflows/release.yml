name: Release

# Publishes all twelve crates to crates.io.
#
# Trigger is a `v*` tag (e.g. `v0.1.0`), or a manual run. A manual run defaults to a dry run,
# so the safe action is also the default one: `workflow_dispatch` with nothing changed uploads
# nothing. Only a tag push, or a manual run with `dry_run: false`, actually publishes.
#
# Publishing is irreversible: a version can be yanked but never deleted or reused. The full
# CI gate therefore runs *in this workflow* before the upload step, rather than trusting that
# the tagged commit happened to be green on `main`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without uploading"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # As in `ci.yml`: prost code is generated at build time by `protox` (a pure-Rust protoc),
  # so no `protobuf-compiler` package is installed anywhere in this workflow.
  RUST_TOOLCHAIN: "1.98.0"

# Two concurrent releases would race each other onto the registry index.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: verify and publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The same gate `ci.yml` enforces. Duplicated deliberately: a tag can point at any commit,
      # including one that never passed CI, and an unpublish is not available as a remedy.
      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      # On a tag build, refuse to publish a version the tag does not name. Catches the common
      # mistake of tagging `v0.2.0` while the manifests still say `0.1.0`, which would otherwise
      # silently re-publish (and fail on) the old version.
      - name: tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ntkd") | .version')
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match ntkd version ${manifest}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version ${manifest}"

      # `cargo publish --workspace` (stable since 1.90) resolves the twelve crates' dependency
      # order itself and waits for each to appear in the registry index before publishing the
      # crates that depend on it. That ordering is therefore NOT hardcoded here — a hand-written
      # crate list is exactly the thing that rots when a dependency edge changes.
      - name: cargo publish --workspace (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish --workspace --dry-run

      # Resumable publish.
      #
      # crates.io rate-limits the creation of *new* crates: a burst of 5, then one per 10
      # minutes (https://crates.io/docs/rate-limits). A workspace publishing twelve new crates
      # at once therefore cannot succeed in a single pass — the first release attempt uploaded
      # five and died on `429 Too Many Requests`, leaving the release half-done.
      #
      # So: publish one crate at a time in dependency order, skip anything already on the
      # registry, and treat a 429 as "wait and retry" rather than as a failure. Skipping makes
      # the whole job idempotent, which is what lets a partially-completed release simply be
      # re-run instead of needing a version bump. The limit only applies to brand-new crates;
      # once all twelve exist, subsequent releases publish new versions at 1/minute and this
      # loop costs nothing.
      - name: cargo publish (resumable, rate-limit aware)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        # The repository secret is named CRATES_TOKEN; cargo reads CARGO_REGISTRY_TOKEN.
        # CARGO_TERM_COLOR is forced off for this step: the workflow sets it to `always`
        # globally, which makes cargo wrap "Uploading" in ANSI escapes and silently breaks the
        # order extraction below (it did exactly that on the first attempt).
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail

          # Dependency order comes from cargo itself, not a hand-rolled topological sort and not
          # a hardcoded list: a dry run prints one "Uploading <crate>" line per member, already
          # ordered. Deriving it this way cannot drift when a dependency edge changes. The dry
          # run also re-verifies that every crate still packages cleanly before anything uploads.
          # The sed strips any residual ANSI escapes before matching, belt-and-braces.
          order=$(cargo publish --workspace --dry-run 2>&1 \
            | sed -e 's/\x1b\[[0-9;]*m//g' \
            | sed -n 's/^[[:space:]]*Uploading \([A-Za-z0-9_-]*\) .*/\1/p')
          if [ -z "$order" ]; then
            echo "::error::could not derive publish order from cargo publish --dry-run"
            exit 1
          fi

          echo "publish order: $(echo "$order" | tr "\n" " ")"

          for crate in $order; do
            ver=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')

            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/${crate}/${ver}")
            if [ "$code" = "200" ]; then
              echo "== ${crate} ${ver} already on crates.io, skipping"
              continue
            fi

            # Up to 6 attempts: covers five consecutive 10-minute rate-limit windows.
            for attempt in 1 2 3 4 5 6; do
              echo "== publishing ${crate} ${ver} (attempt ${attempt})"
              out=$(cargo publish -p "${crate}" --no-verify 2>&1) && { echo "$out"; break; }
              echo "$out"
              if echo "$out" | grep -q "already exists"; then
                echo "== ${crate} ${ver} raced in, continuing"
                break
              fi
              if echo "$out" | grep -q "429 Too Many Requests"; then
                echo "== rate limited; sleeping 630s before retrying ${crate}"
                sleep 630
                continue
              fi
              echo "::error::publishing ${crate} ${ver} failed for a reason other than rate limiting"
              exit 1
            done
          done

          echo "== all workspace crates are on crates.io"
