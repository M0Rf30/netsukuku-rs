name: Release

# Publishes all twelve crates to crates.io and attaches static `ntkd` binaries to the GitHub
# Release.
#
# Trigger is a `v*` tag (e.g. `v0.1.0`), or a manual run. A manual run defaults to a dry run,
# so the safe action is also the default one: `workflow_dispatch` with nothing changed uploads
# nothing to crates.io. Only a tag push, or a manual run with `dry_run: false`, actually
# publishes. The binaries job builds and verifies on every trigger (harmless: it's local
# compilation, not a registry write) but only attaches to a GitHub Release on a tag push, since
# `workflow_dispatch` has no release to attach to.
#
# Publishing is irreversible: a version can be yanked but never deleted or reused. The full
# CI gate therefore runs *in this workflow*, in its own `test` job, before either the publish
# or the binaries job, rather than trusting that the tagged commit happened to be green on
# `main`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without uploading"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # As in `ci.yml`: prost code is generated at build time by `protox` (a pure-Rust protoc),
  # so no `protobuf-compiler` package is installed anywhere in this workflow.
  RUST_TOOLCHAIN: "1.98.0"

# Two concurrent releases would race each other onto the registry index (and onto the same
# GitHub Release's asset list).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same gate `ci.yml` enforces. Duplicated deliberately: a tag can point at any commit,
  # including one that never passed CI, and an unpublish is not available as a remedy. Both
  # `publish` and `binaries` depend on this job and not on each other, so a crates.io rate
  # limit in `publish` can never block a user from getting a binary, and a slow binary build
  # can never delay publishing.
  test:
    name: build, test, lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      # Resolved once here and shared via job output, so neither `publish`'s dry-run nor
      # `binaries`' tarball naming has to re-derive it from `cargo metadata`.
      - name: resolve ntkd version
        id: version
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ntkd") | .version')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # On a tag build, refuse to publish a version the tag does not name. Catches the common
      # mistake of tagging `v0.2.0` while the manifests still say `0.1.0`, which would otherwise
      # silently re-publish (and fail on) the old version.
      - name: tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match ntkd version ${manifest}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version ${manifest}"

  publish:
    name: publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      # `cargo publish --workspace` (stable since 1.90) resolves the twelve crates' dependency
      # order itself and waits for each to appear in the registry index before publishing the
      # crates that depend on it. That ordering is therefore NOT hardcoded here — a hand-written
      # crate list is exactly the thing that rots when a dependency edge changes.
      - name: cargo publish --workspace (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish --workspace --dry-run

      # Resumable publish.
      #
      # crates.io rate-limits the creation of *new* crates: a burst of 5, then one per 10
      # minutes (https://crates.io/docs/rate-limits). A workspace publishing twelve new crates
      # at once therefore cannot succeed in a single pass — the first release attempt uploaded
      # five and died on `429 Too Many Requests`, leaving the release half-done.
      #
      # So: publish one crate at a time in dependency order, skip anything already on the
      # registry, and treat a 429 as "wait and retry" rather than as a failure. Skipping makes
      # the whole job idempotent, which is what lets a partially-completed release simply be
      # re-run instead of needing a version bump. The limit only applies to brand-new crates;
      # once all twelve exist, subsequent releases publish new versions at 1/minute and this
      # loop costs nothing.
      - name: cargo publish (resumable, rate-limit aware)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        # The repository secret is named CRATES_TOKEN; cargo reads CARGO_REGISTRY_TOKEN.
        # CARGO_TERM_COLOR is forced off for this step: the workflow sets it to `always`
        # globally, which makes cargo wrap "Uploading" in ANSI escapes and silently breaks the
        # order extraction below (it did exactly that on the first attempt).
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail

          # Dependency order comes from cargo itself, not a hand-rolled topological sort and not
          # a hardcoded list: a dry run prints one "Uploading <crate>" line per member, already
          # ordered. Deriving it this way cannot drift when a dependency edge changes. The dry
          # run also re-verifies that every crate still packages cleanly before anything uploads.
          # The sed strips any residual ANSI escapes before matching, belt-and-braces.
          order=$(cargo publish --workspace --dry-run 2>&1 \
            | sed -e 's/\x1b\[[0-9;]*m//g' \
            | sed -n 's/^[[:space:]]*Uploading \([A-Za-z0-9_-]*\) .*/\1/p')
          if [ -z "$order" ]; then
            echo "::error::could not derive publish order from cargo publish --dry-run"
            exit 1
          fi

          echo "publish order: $(echo "$order" | tr "\n" " ")"

          for crate in $order; do
            ver=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')

            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/${crate}/${ver}")
            if [ "$code" = "200" ]; then
              echo "== ${crate} ${ver} already on crates.io, skipping"
              continue
            fi

            # Up to 6 attempts: covers five consecutive 10-minute rate-limit windows.
            for attempt in 1 2 3 4 5 6; do
              echo "== publishing ${crate} ${ver} (attempt ${attempt})"
              out=$(cargo publish -p "${crate}" --no-verify 2>&1) && { echo "$out"; break; }
              echo "$out"
              if echo "$out" | grep -q "already exists"; then
                echo "== ${crate} ${ver} raced in, continuing"
                break
              fi
              if echo "$out" | grep -q "429 Too Many Requests"; then
                echo "== rate limited; sleeping 630s before retrying ${crate}"
                sleep 630
                continue
              fi
              echo "::error::publishing ${crate} ${ver} failed for a reason other than rate limiting"
              exit 1
            done
          done

          echo "== all workspace crates are on crates.io"

  binaries:
    name: static binary (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    # Only this job writes anything (release assets); every other job keeps the default
    # (read-only) GITHUB_TOKEN.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Native runners instead of cross-compilation: ubuntu-24.04-arm is a GitHub-hosted
        # aarch64 runner (available to public repos), so the aarch64 leg is a same-arch build
        # exactly like the x86_64 leg — no cross linker, no cross C toolchain for build-script
        # C/asm dependencies, nothing to get subtly wrong.
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `musl-tools` provides `musl-gcc`, the linker driver cargo needs to produce a musl
      # binary. Since the runner's own arch always matches the target here (see the matrix
      # comment above), the native `musl-tools` package is enough — no per-target linker
      # override in `.cargo/config.toml` is required.
      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: cargo build --profile dist --target ${{ matrix.target }}
        run: cargo build --profile dist --locked --target ${{ matrix.target }} -p ntkd

      # A "static" musl binary that turns out to be dynamically linked (e.g. because linking
      # silently fell through to the host's glibc `cc`) breaks `FROM scratch` containers and
      # the OpenWrt/Arch `-bin` payloads, both of which assume no runtime linker is present.
      # Caught here, at build time, instead of downstream in a container that just won't start.
      #
      # The test is the presence of an ELF INTERP segment (the dynamic loader), NOT a string
      # match on `file` output. An earlier version grepped for "statically linked" and rejected a
      # perfectly good binary that `file` described as "static-pie linked" — the phrasing varies
      # by `file` version and by architecture (the aarch64 leg passed while x86_64 failed on the
      # exact same kind of binary). INTERP is unambiguous: a static binary has none, a dynamic
      # one always has exactly one naming its loader.
      - name: verify static linking
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/dist/ntkd"
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::${bin} requires a dynamic loader; it is not static"
            readelf -l "$bin" | grep -A1 INTERP
            exit 1
          fi
          echo "no INTERP segment: statically linked"

      - name: package tarball
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          cp "target/${{ matrix.target }}/dist/ntkd" "$stage/ntkd"
          cp LICENSE "$stage/LICENSE"
          cp README.md "$stage/README.md"
          tarball="ntkd-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C "$stage" -czf "$tarball" ntkd LICENSE README.md
          sha256sum "$tarball" > "$tarball.sha256"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      # Tag pushes attach to the GitHub Release for that tag (auto-created by this action if it
      # doesn't exist yet). `workflow_dispatch` runs, dry-run or not, have no release to attach
      # to, so they fall back to a plain workflow artifact instead of failing the job.
      - name: attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256

      - name: upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: ntkd-${{ matrix.target }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
