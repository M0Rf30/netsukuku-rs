name: Container

# Builds the `Containerfile` and publishes it to GHCR on a version tag. `pull_request` and
# `workflow_dispatch` runs build (and, per platform, smoke-test with `--help`) WITHOUT pushing,
# so a Containerfile change gets verified on every PR without ever publishing a junk tag; only a
# `v*` tag push logs in and pushes.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Containerfile"
      - ".github/workflows/container.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch: {}

env:
  # GHCR is case-sensitive and requires a lowercase path; the GitHub org/user is `M0Rf30`.
  IMAGE: ghcr.io/m0rf30/netsukuku-rs

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners, not buildx+QEMU. This workspace builds under `--profile dist`
          # (fat LTO, codegen-units=1, 12 crates / ~44k lines) specifically to minimize the
          # shipped binary, and that is the exact combination QEMU's instruction-by-instruction
          # translation punishes hardest for a Rust build -- LTO alone has been observed to turn
          # a ~2 minute native build into an hour-plus emulated one. GitHub now offers a real
          # arm64 runner (`ubuntu-24.04-arm`), so there is no reason to pay that tax.
          - arch: amd64
            runs-on: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: derive image version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          else
            # PR/dispatch builds never get pushed, so this only has to be a valid label value,
            # not a value anyone will ever look up.
            echo "version=0.0.0-ci" >>"$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      # Real tag: build each platform standalone and push it to the registry by digest. A
      # manifest list combining the two digests into the version/latest tags is created once,
      # after both matrix legs finish, by the `merge` job below -- this is docker's documented
      # pattern for distributing one multi-platform image across independent runners.
      - name: build and push by digest
        if: startsWith(github.ref, 'refs/tags/v')
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NTKD_VERSION=${{ steps.version.outputs.version }}
            NTKD_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: export digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build_push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: upload digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # PR / manual dispatch: build the same platform locally (no push) and smoke-test it, so a
      # broken Containerfile is caught before it ever reaches a tag build.
      - name: build (verify only, no push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NTKD_VERSION=${{ steps.version.outputs.version }}
            NTKD_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:ci-${{ matrix.arch }}
          load: true

      - name: smoke test (verify-only build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: docker run --rm ${{ env.IMAGE }}:ci-${{ matrix.arch }} --help

  # `login-action` above authenticates the daemon on the login step; `secrets.GITHUB_TOKEN` is
  # the default repo token scoped by the `packages: write` permission above -- no repo secret to
  # create or rotate.
  merge:
    name: merge multi-arch manifest and tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is only ever pointed at a real tagged release here, never at a PR/dispatch
      # build (those never reach this job at all).
      - name: create manifest list, tag version + latest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.build.outputs.version }}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ needs.build.outputs.version }}"
