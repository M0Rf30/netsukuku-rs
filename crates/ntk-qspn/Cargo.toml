[package]
name = "ntk-qspn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "QSPN v2 routing core: ETP propagation, path admission, and split/merge detection."
readme = "README.md"
homepage.workspace = true
keywords = ["netsukuku", "mesh", "routing", "qspn", "mesh-network"]
categories = ["network-programming", "algorithms", "data-structures"]

[lints]
workspace = true

[dependencies]
ntk-common.workspace = true
ntk-proto.workspace = true
ntk-rpc.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util.workspace = true
futures.workspace = true
prost.workspace = true
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "test-util",
] }
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "qspn_bench"
harness = false
