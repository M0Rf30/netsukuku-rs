prost.workspace = true
thiserror.workspace = true
tracing.workspace = true
ed25519-dalek.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
