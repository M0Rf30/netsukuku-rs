[package]
name = "ntk-andna"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ANDNA: the distributed hostname service, built as two PeerServices instances (RFC 0014) rather than bespoke routing."

[lints]
workspace = true

[dependencies]
ntk-common.workspace = true
ntk-proto.workspace = true
ntk-rpc.workspace = true
ntk-peerservices.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
blake3.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util.workspace = true
futures.workspace = true
prost.workspace = true
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time", "test-util"] }
