[package]
name = "ntk-neighborhood"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Link/arc discovery and liveness monitoring for netsukuku-rs (the Rust port of the Vala neighborhood module)."
readme = "README.md"
homepage.workspace = true
keywords = ["netsukuku", "mesh", "neighbor-discovery", "liveness", "rtt"]
